<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            /* margin: 0%; */
        }

        h1{
            background-color: aqua;
            color: red;
        }

        .pradeep{
            text-align: center;
            font-size: 50px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        .ele{
            color: green;
            font-size: 40px;
        }

        #heading{
            background-color: brown;
            color: white;
            text-align: center;
            font-size: 30px;
            text-shadow: 0px 1px yellow;
            padding:20px;
            border: 5px solid blue;
            margin: 20px;
            border-radius: 20px;
            box-shadow: 2px 2px 30px 5px green;
        }

        h1:hover{
            background-color: red;
            color: black;
        }
    </style>
</head>
<body>
    
    <!-- Selectors: How many ways we can apply a CSS to particular element -->

    <h1 class="pradeep">I am Heading 1 Tag</h1>

    <h1>Hiiii</h1>

    <h2 class="ele">I am all about class Selector</h2>

    <h3 id="heading">I am all Id Selector</h3>

    <h1>Hello</h1>

    
</body>
</html>

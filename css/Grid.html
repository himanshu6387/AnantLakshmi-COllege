<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            border: 1px solid;
            padding: 10px;
        }

        .parent{
            display: grid;
            grid-template-columns: 400px 400px 300px;
            grid-template-rows: 250px 200px;
            row-gap: 30px;
            column-gap: 50px;
            justify-content: center;
            align-content: center;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="box">
            <h3>Foundation: Early Exposure to Emerging Tech</h3>
            <p>Introduce students to foundational concepts, career pathways, and digital tools from the very first year. Spark curiosity and build awareness of high-demand skills and industries.</p>
        </div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>

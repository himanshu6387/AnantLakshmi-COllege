<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0%;
        }

        .header{
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 1px 10px 2px gray;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        ul{
            display: flex;
            width: 30%;
            justify-content: space-around;
            list-style: none;
        }

        button{
            background-color: rgb(48, 48, 181);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-weight: bold;
            box-shadow: 0 0 10px 2px gray;
        }
    </style>
</head>
<body>
     <div class="header">
        <img width="200" src="https://thesmartbridge.com/lovable-uploads/sm3.png" alt="">

        <ul>
            <li>Home</li>
            <li>About Us</li>
            <li>Solutions</li>
            <li>Products</li>
            <li>Careers</li>
        </ul>

        <button>Get In Touch</button>
    </div>

    <h1>About Page</h1>
</body>
</html>

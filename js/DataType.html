<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        
        // Primitive DataType: which stores single values

        // String
        let name = "Purna Nand"
        console.log(typeof name,name)

        // Number 
        let num = 1999.99
        console.log(typeof num,num)

        // Boolean
        let userLoggedIn = true
        console.log(typeof userLoggedIn,userLoggedIn)

        // Undefined
        let login;
        console.log(typeof login)

        // null
        let cart = null
        console.log(typeof null)


        // Non-Primitive DataType: which stores multiple values
    </script>
</body>
</html>

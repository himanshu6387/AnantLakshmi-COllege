    <script>

    //   Template Literal

    // function addition(a,b,c){

    // Spread: Unpack or expands or separate the values from an array or object

    const fruit1 = ['Apple','Banana','Papaya','Orange','Avacado']
    console.log(...fruit1) 

    const course1 = ['OS','CN','Automata','Soft Skill']
    const course2 = ['COA','Python','Java','Full Stack Dev']
                     
    const courses = [...course1,...course2]
    console.log(courses)

    // Object
    const car = {name:'Wagoner',price:800000}

    const ExCar = {...car,color:'White',brand:'Suzuki'}
    console.log(ExCar)



    // Destructuring : The process that allows you access the values from an Array or object by assigning to another variable

    const electronics = ['Fan','Bulb','LED','AC','Cooler']
    const [first,second,third] = electronics
    console.log(first,second)


    const clothes = {
        name:'Shirt',
        brand:'Peter England',

    }
